[project]
name = "product-api"
version = "0.0.0"
description = "Backend API for the E2E Self-Heal product layer"
requires-python = ">=3.13"
dependencies = [
    # The core package, only for its machine-readable CI contract (app.schemas).
    "ai-driven-e2e",
    "alembic>=1.13",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.3",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy>=2.0",
    "structlog>=24.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pyright>=1.1",
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.uv.sources]
ai-driven-e2e = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_api"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
