name: safety-benchmark

# Informational only. This workflow never gates a merge: the job is `continue-on-error`, and
# it is skipped (not failed) wherever the model API key is unavailable, such as pull requests
# from forks. Release gates (#292) block a release, never a merge, so this workflow does not
# pass --enforce-gates; run that before tagging (docs/RELEASING.md).
#
# Cost control: pull requests only run it when something that can change repair behaviour
# changed. It also runs on pushes to main, weekly, and on demand.

on:
  workflow_dispatch:
  schedule:
    # Mondays after the free Gemini quota resets (midnight Pacific: 07:00 UTC in daylight saving,
    # 08:00 UTC otherwise), so the weekly run starts with the full daily quota (#411).
    - cron: "17 8 * * 1"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "examples/**"
      - "benchmarks/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/safety-benchmark.yml"
  pull_request:
    paths:
      - "app/**"
      - "examples/**"
      - "benchmarks/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/safety-benchmark.yml"

permissions:
  contents: read

concurrency:
  group: safety-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-secret:
    runs-on: ubuntu-latest
    outputs:
      has-key: ${{ steps.check.outputs.has-key }}
    steps:
      - id: check
        env:
          E2E_HEALER_GEMINI_API_KEY: ${{ secrets.E2E_HEALER_GEMINI_API_KEY }}
        run: |
          if [ -n "$E2E_HEALER_GEMINI_API_KEY" ]; then
            echo "has-key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-key=false" >> "$GITHUB_OUTPUT"
          fi

  safety-benchmark:
    needs: check-secret
    if: needs.check-secret.outputs.has-key == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    # 44 runnable scenarios, each a full repair loop plus browser runs, one at a time: free model
    # tiers rate-limit per minute, and four workers on a free NVIDIA key got 429 on almost every
    # call (#405). A clean local run on the free Gemini tier took about 20 minutes (#408).
    timeout-minutes: 120
    # --jobs 1 limits one run; this limits the key. Every ref shares one free Gemini key, so runs
    # for main, the weekly schedule and pull requests take turns instead of adding up against its
    # per-minute limit. GitHub keeps one running and one pending job per group: a newer pending
    # run replaces an older one, which is acceptable for an informational job. The workflow-level
    # group above still cancels superseded runs of the same ref.
    concurrency:
      group: gemini-safety-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Python dependencies
        run: uv sync --locked --extra dev

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: examples/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: examples/pnpm-lock.yaml

      - name: Install Playwright demo deps
        working-directory: examples
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: examples
        run: pnpm exec playwright install chromium

      - name: Run safety benchmark
        working-directory: examples
        env:
          # The free Gemini tier, through the generic OpenAI-compatible provider (#408). Gemini
          # passed every gate on a free key; the free NVIDIA models either re-typed the lines they
          # patched (#404) or were rate-limited into errors (#405). Use a key from a Google Cloud
          # project without billing, so exceeding the free tier answers 429 instead of billing.
          E2E_HEALER_LLM_PROVIDER: openai
          E2E_HEALER_LLM_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/
          E2E_HEALER_LLM_MODEL: gemini-3.5-flash-lite
          E2E_HEALER_LLM_API_KEY: ${{ secrets.E2E_HEALER_GEMINI_API_KEY }}
          # The worker logs are uploaded as an artifact, which GitHub's secret masking does not
          # cover. Name the key so the engine's own log redaction replaces it wherever it appears.
          E2E_HEALER_SENSITIVE_ENV_VARS: E2E_HEALER_LLM_API_KEY
          # The example Playwright config adds a reporter that runs `e2e-healer review` on every
          # failing test. Benchmark scenarios fail on purpose, so that would add unrelated model
          # calls and distort latency. Use the plain list reporter.
          E2E_HEALER_PLAYWRIGHT_CMD: npx playwright test --reporter=list
          # The default write globs match `*.spec.ts`, not a file literally named `spec.ts`,
          # which is what the scenarios are called. Without this every repair is denied.
          E2E_HEALER_WRITE_GLOBS: "*.spec.ts,**/*.spec.ts,spec.ts,**/spec.ts"
          # --jobs writes each worker's log under a temp directory; putting temp files in
          # RUNNER_TEMP lets the upload step below keep those logs with the report.
          TMPDIR: ${{ runner.temp }}
        run: |
          uv run e2e-healer safety-benchmark \
            --scenario-root scenarios \
            --apply-patches \
            --jobs 1 \
            --output "$RUNNER_TEMP/safety-report.json" \
            --markdown "$RUNNER_TEMP/safety-report.md" \
            --baseline ../benchmarks/safety-baseline.json

      - name: Publish summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/safety-report.md" ]; then
            cat "$RUNNER_TEMP/safety-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The safety benchmark did not produce a report; see the run log." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Structured logs are already redacted in the worker, but a raw write to stdout or stderr
      # (Playwright, a dependency) is not. Redact every worker log file before it is uploaded.
      - name: Redact worker logs
        id: redact
        if: always()
        env:
          E2E_HEALER_LLM_API_KEY: ${{ secrets.E2E_HEALER_GEMINI_API_KEY }}
          E2E_HEALER_SENSITIVE_ENV_VARS: E2E_HEALER_LLM_API_KEY
        run: |
          uv run python - <<'EOF'
          import glob, os
          from app.shadow.redaction import redact_text
          for path in glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "e2e-healer-safety-logs-*", "*.log")):
              with open(path, encoding="utf-8", errors="replace") as handle:
                  text = handle.read()
              with open(path, "w", encoding="utf-8") as handle:
                  handle.write(redact_text(text))
          EOF

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: |
            ${{ runner.temp }}/safety-report.json
            ${{ runner.temp }}/safety-report.md
          if-no-files-found: warn

      # Fail closed: the logs are published only when every one of them was redacted.
      - name: Upload worker logs
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: safety-worker-logs
          path: ${{ runner.temp }}/e2e-healer-safety-logs-*/
          if-no-files-found: warn
