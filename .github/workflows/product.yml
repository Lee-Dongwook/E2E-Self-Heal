name: product

on:
  push:
    branches: [main]
    paths: ["product/**", "app/schemas.py", "pyproject.toml", ".github/workflows/product.yml"]
  pull_request:
    paths: ["product/**", "app/schemas.py", "pyproject.toml", ".github/workflows/product.yml"]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: product
          POSTGRES_PASSWORD: product
          POSTGRES_DB: product
        options: >-
          --health-cmd "pg_isready -U product -d product"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
        ports:
          - 5432:5432
    env:
      PRODUCT_API_DATABASE_URL: postgresql+psycopg://product:product@localhost:5432/product
      PRODUCT_API_TEST_DATABASE_URL: postgresql+psycopg://product:product@localhost:5432/product
    defaults:
      run:
        working-directory: product/api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Check lint, formatting, and types
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright

      - name: Test
        run: |
          uv run alembic upgrade head
          uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: product/web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: product/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
