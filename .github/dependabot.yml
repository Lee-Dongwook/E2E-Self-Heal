# Weekly dependency updates (#349, #424). Minor and patch bumps arrive as one PR per directory;
# each major bump gets its own PR, because those are the ones to read before merging.
#
# Dependabot PRs get no repository secrets, so the safety benchmark skips itself on them. But each
# merge of one that matches the benchmark's path filter starts its own run on main, about 160 of
# the free Gemini tier's 500 daily requests: the engine's group (uv.lock), the examples/ group, any
# Actions bump that touches safety-benchmark.yml, and every separate major bump. Grouping is per
# directory, so these are separate PRs; merge at most two of them per quota day (see the safety
# benchmark reference).
version: 2
updates:
  # The engine: langgraph, langchain-openai, openai, structlog, tenacity, ...
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # The Playwright demo app and safety-benchmark scenarios (pnpm; Dependabot's npm ecosystem).
  - package-ecosystem: "npm"
    directory: "/examples"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/product/api"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/product/web"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
